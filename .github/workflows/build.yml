              /** 0 = normal blocks, 1..3 = LOD with 2/4/8 blocks per quad. Has hysteresis so it does not flicker. */
              public static int tierAt(int chunkX, int chunkZ, int currentTier, double camX, double camZ) {
                  if (!enabled()) {
