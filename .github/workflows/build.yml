              private static int sampleHeight(ClientLevel level, int x, int z) {
                  int cx = x >> 4;
                  int cz = z >> 4;

                  if (!level.hasChunk(cx, cz)) {
                      return Integer.MIN_VALUE;
                  }

                  return level.getHeight(Heightmap.Types.MOTION_BLOCKING, x, z);
