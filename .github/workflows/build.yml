name: Build Sodium Mobile
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Sodium-Mobile-2.1.1
          path: out/*.jar
