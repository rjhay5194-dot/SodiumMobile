                      }
                  }
                  return null;
              }

              private static int firstTint(List<BlockModelPart> parts, Direction dir) {
                  for (BlockModelPart part : parts) {
                      List<BakedQuad> quads = part.getQuads(dir);
                      if (!quads.isEmpty()) {
