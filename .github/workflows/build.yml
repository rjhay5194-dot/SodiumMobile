                  double dx = chunkX - Math.floor(camX / 16.0);
                  double dz = chunkZ - Math.floor(camZ / 16.0);
                  double dist = Math.sqrt(dx * dx + dz * dz);
                  double start = renderDistance * (perf.mobileQuadLodStartPercent / 100.0);

                  if (currentTier > 0) {
                      if (dist < start - 1.0) {
