              private static void put(ChunkVertexEncoder.Vertex v, float x, float y, float z, int color, float shade, float u, float vv) {
                  v.x = x;
                  v.y = y;
                  v.z = z;
                  v.color = color;
                  v.ao = shade;
                  v.u = u;
                  v.v = vv;
                  v.light = LIGHT;
              }

              private static void topQuad(List<Quad> out, Look look, float x0, float x1, float z0, float z1, float y) {
                  TextureAtlasSprite s = look.upSprite;
                  Quad q = new Quad(look.material, ModelQuadFacing.POS_Y, s);
                  int c = toColor(look.upColor);
                  float u0 = s.getU0(), u1 = s.getU1(), v0 = s.getV0(), v1 = s.getV1();
                  put(q.vertices[0], x0, y, z0, c, 1.0f, u0, v0);
                  put(q.vertices[1], x0, y, z1, c, 1.0f, u0, v1);
                  put(q.vertices[2], x1, y, z1, c, 1.0f, u1, v1);
                  put(q.vertices[3], x1, y, z0, c, 1.0f, u1, v0);
                  out.add(q);
              }

              /** dir: 0 = +X, 1 = -X, 2 = +Z, 3 = -Z. The wall sits on the boundary plane of the group and faces dir. */
              private static void wallQuad(List<Quad> out, Look look, int dir, float a0, float a1, float plane, float yBottom, float yTop) {
                  TextureAtlasSprite s = look.sideSprite;
                  int c = toColor(look.sideColor);
                  float u0 = s.getU0(), u1 = s.getU1(), v0 = s.getV0(), v1 = s.getV1();
                  float shade = dir < 2 ? 0.6f : 0.8f;
                  ModelQuadFacing facing = switch (dir) {
                      case 0 -> ModelQuadFacing.POS_X;
                      case 1 -> ModelQuadFacing.NEG_X;
                      case 2 -> ModelQuadFacing.POS_Z;
                      default -> ModelQuadFacing.NEG_Z;
                  };
                  Quad q = new Quad(look.material, facing, s);
                  ChunkVertexEncoder.Vertex[] w = q.vertices;

                  switch (dir) {
                      case 0 -> { // +X, a0..a1 along Z
                          put(w[0], plane, yTop, a1, c, shade, u0, v0);
                          put(w[1], plane, yBottom, a1, c, shade, u0, v1);
                          put(w[2], plane, yBottom, a0, c, shade, u1, v1);
                          put(w[3], plane, yTop, a0, c, shade, u1, v0);
                      }
                      case 1 -> { // -X
                          put(w[0], plane, yTop, a0, c, shade, u0, v0);
                          put(w[1], plane, yBottom, a0, c, shade, u0, v1);
                          put(w[2], plane, yBottom, a1, c, shade, u1, v1);
                          put(w[3], plane, yTop, a1, c, shade, u1, v0);
                      }
                      case 2 -> { // +Z, a0..a1 along X
                          put(w[0], a0, yTop, plane, c, shade, u0, v0);
                          put(w[1], a0, yBottom, plane, c, shade, u0, v1);
                          put(w[2], a1, yBottom, plane, c, shade, u1, v1);
                          put(w[3], a1, yTop, plane, c, shade, u1, v0);
                      }
                      default -> { // -Z
                          put(w[0], a1, yTop, plane, c, shade, u0, v0);
                          put(w[1], a1, yBottom, plane, c, shade, u0, v1);
                          put(w[2], a0, yBottom, plane, c, shade, u1, v1);
                          put(w[3], a0, yTop, plane, c, shade, u1, v0);
                      }
                  }

                  out.add(q);
              }

              /**
               * Builds the LOD mesh for one section. Returns false (and adds nothing) if anything is unavailable,
               * so the caller can fall back to the normal block-by-block mesh.
               */
              public static boolean build(ChunkBuildBuffers buffers, BlockModelShaper shaper, LevelSlice slice, int originX, int originY, int originZ) {
                  Minecraft mc = Minecraft.getInstance();
                  ClientLevel level = mc.level;

                  if (level == null) {
                      return false;
                  }

                  int size = 1 << Math.max(1, Math.min(3, SodiumClientMod.options().performance.mobileQuadLodLevel));
                  int groups = 16 / size;
                  int gridSize = groups + 2;

                  // height grid including a one group border (stores top-face y, or MIN_VALUE if unknown) and the sample column that gave it
                  int[] heights = new int[gridSize * gridSize];
                  int[] sampleX = new int[gridSize * gridSize];
                  int[] sampleZ = new int[gridSize * gridSize];

                  int[] offsets = {0, size - 1};
                  int sampleCount = size == 1 ? 1 : 2;

                  for (int gz = -1; gz <= groups; gz++) {
                      for (int gx = -1; gx <= groups; gx++) {
                          int best = Integer.MAX_VALUE;
                          int bestX = 0;
                          int bestZ = 0;
                          boolean known = true;

                          for (int i = 0; i < sampleCount && known; i++) {
                              for (int j = 0; j < sampleCount; j++) {
                                  int wx = originX + gx * size + offsets[i];
                                  int wz = originZ + gz * size + offsets[j];
                                  int h = sampleHeight(level, wx, wz);

                                  if (h == Integer.MIN_VALUE) {
                                      known = false;
                                      break;
                                  }

                                  if (h < best) {
                                      best = h;
                                      bestX = wx;
                                      bestZ = wz;
                                  }
                              }
                          }

                          int idx = (gz + 1) * gridSize + (gx + 1);
                          heights[idx] = known ? best : Integer.MIN_VALUE;
                          sampleX[idx] = bestX;
                          sampleZ[idx] = bestZ;
                      }
                  }

                  int secMinY = originY;
                  int secMaxY = originY + 16;

                  List<Quad> quads = new ArrayList<>();
                  HashMap<BlockState, Look> looks = new HashMap<>();
                  BlockPos.MutableBlockPos pos = new BlockPos.MutableBlockPos();

                  int[][] steps = {{1, 0}, {-1, 0}, {0, 1}, {0, -1}};

                  for (int gz = 0; gz < groups; gz++) {
                      for (int gx = 0; gx < groups; gx++) {
                          int idx = (gz + 1) * gridSize + (gx + 1);
                          int h = heights[idx];

                          if (h == Integer.MIN_VALUE) {
                              continue;
                          }

                          float x0 = gx * size;
                          float x1 = x0 + size;
                          float z0 = gz * size;
                          float z1 = z0 + size;

                          BlockState state;
                          Look look;

                          boolean topHere = h - 1 >= secMinY && h - 1 < secMaxY;
                          boolean wallHere = false;

                          for (int[] step : steps) {
                              int hn = heights[(gz + 1 + step[1]) * gridSize + (gx + 1 + step[0])];
                              if (hn != Integer.MIN_VALUE && hn < h && Math.min(h, secMaxY) > Math.max(hn, secMinY)) {
                                  wallHere = true;
                              }
                          }

                          if (!topHere && !wallHere) {
                              continue;
                          }

                          int lookY = Math.max(secMinY, Math.min(secMaxY - 1, h - 1));
                          int lx = sampleX[idx];
                          int lz = sampleZ[idx];

                          // use the real top block when it is inside this section, otherwise the block at the section edge
                          pos.set(lx, lookY, lz);
                          state = slice.getBlockState(lx, lookY, lz);

                          if (state.isAir()) {
                              // air at the sampled spot (e.g. top block is above/below this section): look for the nearest solid below
                              int yy = lookY;
                              while (yy > secMinY && slice.getBlockState(lx, yy, lz).isAir()) {
